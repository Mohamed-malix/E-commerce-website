<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy shopping</title>
  </head>
  <body>
    <div class="containerDiv">
        <nav class="navBar">
            <div class="navLinks d-flex align-items-center gap-4">
                <div class="icon fs-4">Happy Shopping</div>
                <ul class="ulLinks d-flex align-items-center">
                    <li class="me-4 mt-3"><a href="#" target="_blank" rel="noopener noreferrer">Home</a></li>
                    <li class="me-4 mt-3"><a href="#" target="_blank" rel="noopener noreferrer">Events & news</a></li>
                    <li class="me-4 mt-3"><a href="#" target="_blank" rel="noopener noreferrer">Contact</a></li>
                </ul>
            </div>
            <form class="d-flex" role="search">
                <input
                  class="form-control me-2"
                  type="search"
                  placeholder="Search"
                  aria-label="Search"
                />
                <button class="btn" type="submit">
                  Search
                </button>
              </form>
        </nav>

        <div class="loading h-100 d-flex flex-column align-items-center justify-content-center d-none">
          <div class="spinner-border text-light" role="status" style="width:2.6rem; height:2.6rem">
           <span class="visually-hidden">Loading...</span>
         </div>
         <p class="text-light mt-5 fs-4">Loading products....</p>
        </div>

        <div class="noProduct text-center py-5 h-100 d-flex flex-column justify-content-center align-items-center">
          <i class="fa-solid fa-magnifying-glass display-2 text-light"></i>
          <h4 class="mt-5 text-light noFound">No product found</h4>
          <p class="text-light trySearch">Try searching for something else.</p>
        </div>

      <div class="content">

      </div>


      <footer class="footer py-3 d-flex justify-content-center align-items-center w-100 mt-5">
        Mohamed-Malix | all rights reserved 
      </footer>
    </div>
  </body>
</html>
